<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Notes App</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        body {
            margin: 0;
            background: #f5f7fb;
            min-height: 100vh;
        }

        .container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 20px;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #222;
        }

        /* Add Note Card */
        .add-note-card {
            background: #fff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 6px 16px rgba(0,0,0,0.08);
            margin-bottom: 40px;
        }

        .add-note-card h2 {
            margin-top: 0;
            margin-bottom: 15px;
            font-size: 18px;
        }

        input, textarea {
            width: 100%;
            padding: 10px 12px;
            margin-bottom: 15px;
            border-radius: 8px;
            border: 1px solid #d1d5db;
            font-size: 14px;
        }

        textarea {
            resize: vertical;
            min-height: 90px;
        }

        button {
            background: #6366f1;
            color: #fff;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
        }

        button:hover {
            background: #4f46e5;
        }

        /* Notes Grid */
        .notes-section h2 {
            margin-bottom: 15px;
            font-size: 18px;
        }

        .notes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 18px;
        }

        /* Small Note Cards */
        .note-card {
            background: #ffffff;
            padding: 14px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.07);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .note-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 18px rgba(0,0,0,0.12);
        }

        .note-card h3 {
            margin: 0 0 8px 0;
            font-size: 15px;
            color: #111;
            word-break: break-word;
        }

        .note-card p {
            margin: 0;
            font-size: 13px;
            color: #555;
            line-height: 1.4;
            word-break: break-word;
        }
        .note-card {
            position: relative;
        }

        .delete-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            background: transparent;
            border: none;
            color: #9ca3af;
            font-size: 14px;
            cursor: pointer;
            display: none;
        }

        .note-card:hover .delete-btn {
            display: block;
        }

        .delete-btn:hover {
            color: #ef4444;
        }

    </style>
</head>
<body>

<div class="container">
    <h1>Notes App</h1>

    <!-- Add Note -->
    <div class="add-note-card">
        <h2>Add a Note</h2>
        <input id="title" placeholder="Title">
        <textarea id="content" placeholder="Content"></textarea>
        <button onclick="addNote()">Add Note</button>
    </div>

    <!-- Notes -->
    <div class="notes-section">
        <h2>Your Notes</h2>
        <div id="notes" class="notes-grid"></div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
