<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>To-Do App</title>

    <style>
        body {
            font-family: "Segoe UI", sans-serif;
            background: #f4f6fb;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 700px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        .add-task {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr auto;
            gap: 10px;
            margin-bottom: 30px;
        }

        input, select {
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-size: 14px;
        }

        button {
            padding: 10px 14px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }

        .add-btn {
            background: #4f46e5;
            color: white;
        }

        .task-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .task-card {
            background: #fff;
            padding: 15px;
            border-radius: 10px;
            border-left: 6px solid #4f46e5;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
        }

        .task-card.done {
            opacity: 0.6;
            text-decoration: line-through;
        }

        .task-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .priority {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            color: white;
        }

        .p1 { background: #dc2626; }
        .p2 { background: #f59e0b; }
        .p3 { background: #16a34a; }

        .task-body {
            margin: 10px 0;
            font-size: 14px;
            color: #555;
        }

        .task-actions {
            display: flex;
            gap: 10px;
        }

        .done-btn {
            background: #22c55e;
            color: white;
        }

        .delete-btn {
            background: #ef4444;
            color: white;
        }
        .completed-text {
            text-decoration: line-through;
            opacity: 0.6;
        }

        .edit-btn {
            background: #0ea5e9;
            color: white;
        }
        /* Modal overlay */
        .modal {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .hidden {
            display: none;
        }

        /* Modal card */
        .modal-card {
            background: white;
            width: 350px;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .modal-card h2 {
            margin: 0;
            text-align: center;
        }

        .modal-actions {
            display: flex;
            justify-content: space-between;
        }

        .save-btn {
            background: #22c55e;
            color: white;
        }

        .cancel-btn {
            background: #9ca3af;
            color: white;
        }
    </style>
</head>

<body>

<div class="container">
    <h1>📝 To-Do List</h1>

    <div class="add-task">
        <input id="title" placeholder="Task title" />
        <input id="due_date" type="date" />
        <select id="priority">
            <option value="1">High</option>
            <option value="2">Medium</option>
            <option value="3">Low</option>
        </select>
        <button class="add-btn" onclick="addTask()">Add</button>
    </div>

    <div id="tasks" class="task-list"></div>
</div>

<!-- Edit Task Modal -->
<div id="editModal" class="modal hidden">
    <div class="modal-card">
        <h2>Edit Task</h2>

        <input id="edit_title" placeholder="Task title" />
        <input id="edit_due_date" type="date" />

        <select id="edit_priority">
            <option value="1">High</option>
            <option value="2">Medium</option>
            <option value="3">Low</option>
        </select>

        <div class="modal-actions">
            <button class="btn save-btn" onclick="saveEdit()">Save</button>
            <button class="btn cancel-btn" onclick="closeEdit()">Cancel</button>
        </div>
    </div>
</div>


<script src="script.js"></script>
</body>
</html>
